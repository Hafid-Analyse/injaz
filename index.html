<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>من الفكرة إلى الإنجاز</title>
<meta name="theme-color" content="#F4F5F9" id="themeColor">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="إنجاز">
<script>
// تطبيق المظهر قبل رسم الصفحة لتفادي الوميض
(function(){ try{ var t = JSON.parse(localStorage.getItem('injaz_theme')); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); }catch(e){} })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F9; --card:#FFFFFF; --ink:#1F2433; --ink2:#4F586C; --muted:#8A93A6; --line:#E6E8EF; --soft:#F0F1F6;
  --shadow:0 1px 2px rgba(20,24,40,.04),0 6px 20px rgba(20,24,40,.06);
  --shadow-lg:0 18px 40px rgba(20,24,40,.16);
  --accent:#F2547D; --grad:linear-gradient(135deg,#FF8A5B 0%,#F2547D 100%);
  --start:#F2547D; --plan:#7C6CF2; --quick:#16A982; --archive:#8E98AC;
  --start-bg:rgba(242,84,125,.10); --plan-bg:rgba(124,108,242,.11); --quick-bg:rgba(22,169,130,.11); --archive-bg:rgba(142,152,172,.14);
  --danger:#E0354B;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1117; --card:#191C25; --ink:#ECEEF4; --ink2:#B3B9C8; --muted:#7D8597; --line:#272B37; --soft:#20242F;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --shadow-lg:0 18px 40px rgba(0,0,0,.5);
    --start-bg:rgba(242,84,125,.16); --plan-bg:rgba(124,108,242,.18); --quick-bg:rgba(22,169,130,.18); --archive-bg:rgba(142,152,172,.16);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1117; --card:#191C25; --ink:#ECEEF4; --ink2:#B3B9C8; --muted:#7D8597; --line:#272B37; --soft:#20242F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --shadow-lg:0 18px 40px rgba(0,0,0,.5);
  --start-bg:rgba(242,84,125,.16); --plan-bg:rgba(124,108,242,.18); --quick-bg:rgba(22,169,130,.18); --archive-bg:rgba(142,152,172,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* منع التمرير الأفقي وتكبير الخط التلقائي في الهاتف */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden;touch-action:pan-y pinch-zoom}
body{overflow-x:hidden;width:100%;max-width:100vw;overscroll-behavior-x:none}
button{touch-action:manipulation}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',system-ui,sans-serif;font-size:16px;line-height:1.55;transition:background .25s,color .25s}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 48px;overflow-wrap:anywhere}
.num{unicode-bidi:isolate;direction:ltr;display:inline-block}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
svg{display:block}
.screen{display:none}.screen.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.pad{padding:18px}
.muted{color:var(--muted)}

/* أزرار */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:16px;padding:15px;font-weight:700;font-size:17px;background:var(--grad);color:#fff;box-shadow:0 8px 20px rgba(242,84,125,.28);transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn + .btn{margin-top:10px}
.icon-btn{width:42px;height:42px;flex-shrink:0;border-radius:13px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink2)}
.icon-btn svg{width:20px;height:20px}
.icon-btn:active{transform:scale(.95)}

/* حقول */
label.lbl{display:block;font-weight:700;font-size:15px;margin:0 2px 8px}
input,textarea{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--soft);border:1.5px solid transparent;border-radius:14px;padding:13px 14px;transition:border-color .15s,background .15s}
input:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--card)}
input::placeholder,textarea::placeholder{color:var(--muted)}
textarea{min-height:110px;resize:vertical}
.field + .field{margin-top:16px}

/* الرأس */
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.top .who{flex:1;display:flex;align-items:center;gap:12px;min-width:0}
.top .who img{width:44px;height:44px;border-radius:13px;flex-shrink:0}
.top .who small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.top .who b{display:block;font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.bar-top .ttl{font-weight:800;font-size:17px}

/* المتحكم في الساعات */
.stepper{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--soft);border-radius:18px;padding:10px}
.stepper button{width:52px;height:52px;border-radius:15px;border:0;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink)}
.stepper button svg{width:22px;height:22px}
.stepper .val{text-align:center}
.stepper .val b{display:block;font-size:34px;font-weight:800;line-height:1.1}
.stepper .val small{color:var(--muted);font-size:13px}
.quick{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.quick button{flex:1;min-width:56px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 0;font-weight:700;font-size:15px;color:var(--ink2)}
.quick button.on{border-color:var(--accent);color:var(--accent);background:var(--start-bg)}
.note{font-size:14px;color:var(--muted);margin-top:12px;min-height:22px}
.note.warn{color:var(--danger)}

/* البداية */
.intro{text-align:center;padding:18px 0 22px}
.intro img{width:88px;height:88px;border-radius:24px;box-shadow:0 14px 30px rgba(242,84,125,.3);margin-bottom:16px}
.intro h1{font-size:25px;font-weight:800}
.intro p{color:var(--muted);margin-top:4px}

/* الملخص */
.summary{padding:16px 18px;margin-bottom:14px}
.summary .line{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.summary .line b{font-size:15px}
.summary .line span{font-size:14px;color:var(--muted)}
.progress{height:8px;background:var(--soft);border-radius:8px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;width:0;background:var(--grad);border-radius:8px;transition:width .5s}
.progress i.over{background:var(--danger)}
.alert{display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:14px;color:var(--danger);background:rgba(224,53,75,.08);padding:9px 12px;border-radius:12px}
.add-btn{margin-bottom:22px}

/* الأقسام */
.section{margin-bottom:18px}
.sec-head{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:6px 2px 10px;text-align:right}
.sec-head .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.sec-head .t{font-weight:800;font-size:16px}
.sec-head .c{font-size:13px;font-weight:700;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1px 9px}
.sec-head .sp{flex:1}
.sec-head svg{width:18px;height:18px;color:var(--muted);transition:transform .2s}
.section.closed .sec-head svg{transform:rotate(90deg)}
.section.closed .list{display:none}
.list{display:grid;gap:10px}

/* بطاقة الفكرة */
.idea{position:relative;display:flex;align-items:center;gap:12px;padding:14px 16px 14px 10px;border-right:5px solid var(--qc);border-radius:18px;cursor:pointer;touch-action:pan-y;transition:transform .12s,box-shadow .2s}
.idea:active{transform:scale(.99)}
.idea.dragging{z-index:5;box-shadow:var(--shadow-lg);cursor:grabbing}
.idea .txt{flex:1;min-width:0}
.idea .txt b{display:block;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idea .txt .stp{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:9px}
.stp.s-idea{color:#5B6B8C;background:rgba(91,107,140,.12)}
.stp.s-doing{color:#E2711D;background:rgba(255,138,91,.15)}
.stp.s-done{color:#16A982;background:rgba(22,169,130,.13)}
.stp.s-paused{color:#8A93A6;background:rgba(138,147,166,.14)}
:root[data-theme="dark"] .stp.s-idea{color:#A9B6D3}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stp.s-idea{color:#A9B6D3}}
.idea.done .txt b{color:var(--muted);text-decoration:line-through}
.score{--p:0;width:44px;height:44px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;background:conic-gradient(var(--qc) calc(var(--p)*1%),var(--soft) 0)}
.score span{width:36px;height:36px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:14px}
.grip{width:28px;height:40px;display:grid;place-items:center;color:var(--muted);cursor:grab;touch-action:none;border-radius:10px;flex-shrink:0}
.grip svg{width:16px;height:16px}
.q-start{--qc:var(--start);--qb:var(--start-bg)}
.q-plan{--qc:var(--plan);--qb:var(--plan-bg)}
.q-quick{--qc:var(--quick);--qb:var(--quick-bg)}
.q-archive{--qc:var(--archive);--qb:var(--archive-bg)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:10px;color:var(--qc);background:var(--qb)}
.empty{text-align:center;padding:30px 20px}
.empty img{width:64px;border-radius:18px;margin-bottom:12px}
.empty b{display:block;font-size:18px}
.empty p{color:var(--muted);margin:4px 0 18px}

/* الأسئلة */
.segs{display:flex;gap:6px;margin-bottom:8px}
.segs div{flex:1;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.segs i{display:block;height:100%;width:0;border-radius:6px;transition:width .3s}
.seg-labels{display:flex;gap:6px;margin-bottom:22px}
.seg-labels span{flex:1;text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.seg-labels span.on{color:var(--ink)}
.qtext{font-size:22px;font-weight:800;line-height:1.45}
.qhint{color:var(--muted);font-size:14px;margin-top:4px}
.opts{display:grid;gap:10px;margin-top:20px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:15px 16px;font-size:17px;transition:border-color .15s,background .15s}
.opt .mk{width:24px;height:24px;flex-shrink:0;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:all .15s}
.opt.multi .mk{border-radius:7px}
.opt .mk svg{width:14px;height:14px;color:#fff;opacity:0}
.opt.sel{border-color:var(--accent);background:var(--start-bg);font-weight:700}
.opt.sel .mk{background:var(--accent);border-color:var(--accent)}
.opt.sel .mk svg{opacity:1}
.qbody{margin-top:20px}
.qfoot{margin-top:22px}
.qcard{animation:slide .28s ease}
@keyframes slide{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}

/* النتيجة والتفاصيل */
.verdict{border-radius:22px;padding:22px 18px;color:#fff;text-align:center;margin-bottom:14px}
.verdict.q-start{background:linear-gradient(135deg,#FF8A5B,#F2547D)}
.verdict.q-plan{background:linear-gradient(135deg,#9D91FF,#6F5FEA)}
.verdict.q-quick{background:linear-gradient(135deg,#3FD3A9,#139C78)}
.verdict.q-archive{background:linear-gradient(135deg,#AEB6C6,#7F899E)}
.verdict small{display:block;opacity:.9;font-size:14px;font-weight:700}
.verdict h2{font-size:28px;font-weight:800;margin:4px 0}
.verdict p{opacity:.92;font-size:15px}
.verdict .sc{display:inline-block;margin-top:12px;background:rgba(255,255,255,.2);border-radius:12px;padding:4px 14px;font-weight:800}
.blk{margin-bottom:14px}
.blk h3{font-size:15px;font-weight:800;margin-bottom:14px;color:var(--ink2)}
.gate{margin-bottom:14px}
.gate:last-child{margin-bottom:0}
.gate .gl{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.gate .gl b{font-weight:700}
.gate .gl span{color:var(--muted)}
.gbar{height:10px;background:var(--soft);border-radius:10px;overflow:hidden}
.gbar i{display:block;height:100%;width:0;border-radius:10px;transition:width .7s cubic-bezier(.3,1.1,.5,1)}
.totals{display:flex;gap:10px;margin-top:16px}
.totals div{flex:1;background:var(--soft);border-radius:14px;padding:10px;text-align:center}
.totals b{display:block;font-size:20px;font-weight:800}
.totals small{color:var(--muted);font-size:13px}
.matrix{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:1fr 1fr;gap:6px;height:200px}
.matrix .cell{border-radius:12px;padding:8px 10px;font-size:12px;font-weight:700;color:var(--qc);background:var(--qb);opacity:.55}
.matrix .cell.hit{opacity:1}
.matrix .pt{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:var(--ink);border:4px solid var(--card);box-shadow:0 4px 12px rgba(0,0,0,.25);transition:all .7s cubic-bezier(.3,1.3,.5,1)}
.axes{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px}
.stepbox{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:15px}
.problem{color:var(--ink2);font-size:15px;margin-top:6px}

/* الحالة */
.status{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:var(--soft);border-radius:14px;padding:4px}
.status button{border:0;background:none;border-radius:11px;padding:9px 2px;font-size:13px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.status button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

/* النافذة السفلية */
.sheet-bg{position:fixed;inset:0;background:rgba(10,12,20,.45);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;right:0;left:0;bottom:0;max-width:520px;margin:0 auto;max-height:90vh;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));z-index:41;transform:translateY(105%);transition:transform .35s cubic-bezier(.3,1.1,.5,1);box-shadow:var(--shadow-lg)}
.sheet.on{transform:none}
.sheet .handle{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.sheet-title{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.sheet-title .t{flex:1;min-width:0}
.sheet-title h2{font-size:21px;font-weight:800;line-height:1.35}
.row-btns{display:flex;gap:10px;margin-top:6px}
.row-btns .btn{margin:0}
.btn.danger{background:var(--card);color:var(--danger);border:1px solid var(--line);box-shadow:none}
.inst-head{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.inst-head img{width:54px;height:54px;border-radius:15px}
.inst-head b{display:block;font-size:17px}
.inst-head small{color:var(--muted);font-size:14px}
.steps-list{margin:0 0 6px;padding-right:22px;line-height:2}

.toast{position:fixed;top:14px;left:50%;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis;transform:translate(-50%,-90px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:700;font-size:15px;transition:transform .35s cubic-bezier(.3,1.3,.5,1);z-index:60;white-space:nowrap;box-shadow:var(--shadow-lg)}
.toast.on{transform:translate(-50%,0)}
</style>
</head>

</svg>
<div class="wrap">

  <!-- 1. البداية والإعدادات -->
  <section class="screen" id="s-setup">
    <div class="bar-top" id="setupBar" hidden><button class="icon-btn" id="setupBack" type="button" aria-label="رجوع"><svg><use href="#i-back"/></svg></button><span class="ttl">الإعدادات</span><span style="width:42px"></span></div>
    <div class="intro" id="setupIntro">
      <img src="logo.svg" alt="">
      <h1>من الفكرة إلى الإنجاز</h1>
      <p>قيّم أفكارك، ورتّبها، وابدأ بما يستحق.</p>
    </div>
    <div class="card pad" style="margin-bottom:14px">
      <div class="field"><label class="lbl" for="pName">اسمك</label><input id="pName" type="text" placeholder="اختياري"></div>
      <div class="field"><label class="lbl">كم ساعة في الأسبوع متاحة لمشاريعك؟</label><div id="setupHours"></div></div>
    </div>
    <div class="card pad" id="themeBlock" style="margin-bottom:14px" hidden>
      <label class="lbl">المظهر</label>
      <div class="status" id="themeSeg" style="grid-template-columns:repeat(3,minmax(0,1fr))"></div>
    </div>
    <button class="btn" id="saveSetup" type="button">حفظ والمتابعة</button>
  </section>

  <!-- 2. الرئيسية -->
  <section class="screen" id="s-board">
    <div class="top">
      <div class="who"><img src="logo.svg" alt=""><div style="min-width:0"><small id="greet"></small><b id="helloName"></b></div></div>
      <button class="icon-btn" id="installBtn" type="button" hidden aria-label="تثبيت التطبيق"><svg><use href="#i-dl"/></svg></button>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="المظهر"><svg><use href="#i-auto"/></svg></button>
      <button class="icon-btn" id="settingsBtn" type="button" aria-label="الإعدادات"><svg><use href="#i-gear"/></svg></button>
    </div>
    <div class="card summary" id="summary"></div>
    <button class="btn add-btn" id="addBtn" type="button"><svg><use href="#i-plus"/></svg>فكرة جديدة</button>
    <div id="sections"></div>
  </section>

  <!-- 3. فكرة جديدة -->
  <section class="screen" id="s-new">
    <div class="bar-top"><button class="icon-btn" id="newBack" type="button" aria-label="رجوع"><svg><use href="#i-back"/></svg></button><span class="ttl" id="newTitle">فكرة جديدة</span><span style="width:42px"></span></div>
    <div class="card pad" style="margin-bottom:14px">
      <div class="field"><label class="lbl" for="ideaName">ما فكرتك؟</label><input id="ideaName" type="text" placeholder="مثال: تطبيق طباعة الصكوك"></div>
      <div class="field"><label class="lbl" for="ideaProblem">ما المشكلة التي تحلها؟</label><input id="ideaProblem" type="text" placeholder="في سطر واحد"></div>
    </div>
    <button class="btn" id="startQ" type="button">ابدأ الأسئلة</button>
  </section>

  <!-- 4. الأسئلة -->
  <section class="screen" id="s-q">
    <div class="bar-top"><button class="icon-btn" id="backQ" type="button" aria-label="السابق"><svg><use href="#i-back"/></svg></button><span class="ttl" id="qCount"></span><button class="icon-btn" id="quitQ" type="button" aria-label="إغلاق" style="font-size:20px;font-weight:700">×</button></div>
    <div class="segs" id="segs"></div>
    <div class="seg-labels" id="segLabels"></div>
    <div class="qcard" id="qCard">
      <p class="qtext" id="qText"></p>
      <p class="qhint" id="qHint"></p>
      <div id="qBody"></div>
    </div>
  </section>

  <!-- 5. النتيجة -->
  <section class="screen" id="s-res">
    <div id="resBody"></div>
    <button class="btn" id="toBoard" type="button">إلى أفكاري</button>
    <button class="btn ghost" id="another" type="button">فكرة جديدة</button>
  </section>
</div>

<!-- نافذة تفاصيل الفكرة -->
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="handle"></div><div id="sheetBody"></div></div>

<div class="toast" id="toast"></div>

<script>
// ===== أدوات =====
const $ = id => document.getElementById(id);
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
// الأرقام معزولة باتجاه يسار→يمين حتى لا تنقلب داخل النص العربي
const iso = s => '<bdi class="num">' + s + '</bdi>';
const ic = (id, extra) => '<svg' + (extra || '') + '><use href="#i-' + id + '"/></svg>';
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('on'),1700); }
function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); window.scrollTo(0,0); }

// ===== المظهر: تلقائي / نهاري / ليلي =====
const THEMES = {auto:['تلقائي','auto'], light:['نهاري','sun'], dark:['ليلي','moon']};
let theme = store.get('injaz_theme', 'auto');
function applyTheme(){
  if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', theme);
  $('themeBtn').innerHTML = ic(THEMES[theme][1]);
  $('themeBtn').setAttribute('aria-label', 'المظهر: ' + THEMES[theme][0]);
  $('themeColor').setAttribute('content', getComputedStyle(document.documentElement).getPropertyValue('--bg').trim());
  $('themeSeg').innerHTML = Object.keys(THEMES).map(k => '<button type="button" data-t="' + k + '" class="' + (k === theme ? 'on' : '') + '">' + ic(THEMES[k][1], ' style="width:18px;height:18px"') + THEMES[k][0] + '</button>').join('');
}
function setTheme(t){ theme = t; store.set('injaz_theme', t); applyTheme(); }
$('themeBtn').onclick = () => { const k = Object.keys(THEMES); setTheme(k[(k.indexOf(theme) + 1) % k.length]); toast('المظهر: ' + THEMES[theme][0]); };
$('themeSeg').onclick = e => { const b = e.target.closest('[data-t]'); if (b) setTheme(b.dataset.t); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

// ===== البوابات والأسئلة =====
const GATES = [
  {name:'الأثر',  max:35, color:'#F2547D'},
  {name:'العائد', max:15, color:'#FF8A5B'},
  {name:'القدرة', max:30, color:'#7C6CF2'},
  {name:'السرعة', max:20, color:'#16A982'}
];
const QS = [
  {g:0, t:'كم مرة يعيش الناس هذه المشكلة؟', o:[['يومياً',10],['أسبوعياً',7],['شهرياً',4],['نادراً',0]]},
  {g:0, t:'كم شخصاً يستفيد؟', o:[['مئات أو أكثر',10],['جماعة أو مؤسسة',7],['أسرتي ومحيطي',4],['أنا وحدي',2]]},
  {g:0, t:'هل يوجد حل آخر لهذه المشكلة؟', o:[['لا يوجد',7],['موجود لكنه ضعيف أو غالٍ',4],['موجود وجيد',0]]},
  {g:0, t:'هل تحققت أن الناس يريدونها فعلاً؟', o:[['سألت 3 أشخاص فأكثر',8],['سألت شخصاً واحداً',4],['لا، هي حماس مني',0]]},
  {g:1, type:'multi', t:'ما العائد منها؟', h:'يمكنك اختيار أكثر من واحد', o:[['شخصي (تعلّم، راحة)',3],['اجتماعي (نفع، أجر)',3],['مادي (دخل)',3]]},
  {g:1, t:'هل تستمر بدون تدخلك الدائم؟', h:'أي يمكن أن يتولاها غيرك', o:[['نعم',6],['جزئياً',3],['لا',0]]},
  {g:2, t:'هل أملك المهارات اللازمة؟', o:[['كلها',8],['أغلبها',5],['أحتاج تعلّم الكثير',1]]},
  {g:2, t:'ما تكلفتها المالية؟', o:[['شبه مجانية',8],['في حدود قدرتي',4],['تحتاج تمويلاً',0]]},
  {g:2, type:'hours', id:'hours', t:'كم ساعة أسبوعياً تحتاج؟'},
  {g:2, t:'هل معي من يساعد أو يكمل بعدي؟', o:[['فريق',6],['شخص واحد',3],['وحدي',0]]},
  {g:3, t:'متى تخرج أول نسخة يجرّبها أحد؟', o:[['خلال أسبوع',10],['خلال شهر',6],['خلال 3 أشهر',3],['أكثر',0]]},
  {g:3, t:'هل يمكن تقسيمها إلى خطوات صغيرة؟', o:[['نعم',5],['صعب',0]]},
  {g:3, t:'هل لها وقت مناسب قد يفوت؟', h:'موسم، مناسبة، دخول مدرسي…', o:[['نعم، الآن',5],['لا يهم',2],['فات وقتها',0]]},
  {g:4, type:'text', id:'step', t:'ما أول خطوة صغيرة أبدأ بها؟', h:'خطوة تستطيع فعلها هذا الأسبوع'}
];
const SEGS = GATES.map(g => g.name).concat(['الخطوة']);
const hoursIdx = QS.findIndex(q => q.id === 'hours');
const stepIdx  = QS.findIndex(q => q.id === 'step');
const QUADS = {
  start:   {t:'ابدأ الآن',  d:'قيمة عالية وسهلة الإنجاز'},
  plan:    {t:'خطّط لها',   d:'قيمة عالية لكنها صعبة: قسّمها، أو ابحث عن شريك أو تمويل'},
  quick:   {t:'مكسب سريع', d:'قيمة محدودة لكنها سهلة: في وقت الفراغ'},
  archive: {t:'أرشفها',     d:'قيمة محدودة وصعبة: احتفظ بها للمستقبل'}
};
const QORDER = ['start','plan','quick','archive'];
const STATUS = {idea:['💡','فكرة'], doing:['🔥','قيد الإنجاز'], done:['✅','منجزة'], paused:['⏸️','مؤجلة']};

let profile = store.get('injaz_profile', null);   // {name, hours}
let idea = null, answers = [], cur = 0, editId = null;

// ===== متحكم الساعات =====
function hoursPicker(host, val, chips, onChange){
  let v = val;
  host.innerHTML = '<div class="stepper"><button type="button" class="pl" aria-label="أكثر">' + ic('plus') + '</button>' +
    '<div class="val"><b></b><small>ساعة في الأسبوع</small></div>' +
    '<button type="button" class="mn" aria-label="أقل">' + ic('minus') + '</button></div>' +
    '<div class="quick">' + chips.map(c => '<button type="button" data-v="' + c + '">' + iso(c) + '</button>').join('') + '</div>';
  const paint = () => {
    host.querySelector('.val b').innerHTML = iso(v);
    host.querySelectorAll('.quick button').forEach(b => b.classList.toggle('on', +b.dataset.v === v));
    onChange && onChange(v);
  };
  host.querySelector('.pl').onclick = () => { v = Math.min(80, v + 1); paint(); };
  host.querySelector('.mn').onclick = () => { v = Math.max(host.dataset.min ? +host.dataset.min : 0, v - 1); paint(); };
  host.querySelectorAll('.quick button').forEach(b => b.onclick = () => { v = +b.dataset.v; paint(); });
  paint();
  return () => v;
}

// ===== البداية / الإعدادات =====
let getSetupHours = null;
function openSetup(){
  const first = !profile;
  $('setupBar').hidden = first; $('setupIntro').hidden = !first; $('themeBlock').hidden = first;
  $('saveSetup').textContent = first ? 'ابدأ' : 'حفظ';
  $('pName').value = profile && profile.name || '';
  $('setupHours').dataset.min = 1;
  getSetupHours = hoursPicker($('setupHours'), profile ? profile.hours : 10, [5,10,15,20]);
  show('s-setup');
}
$('saveSetup').onclick = () => {
  profile = {name: $('pName').value.trim(), hours: Math.max(1, getSetupHours())};
  store.set('injaz_profile', profile);
  openBoard(); toast('تم الحفظ');
};
$('setupBack').onclick = () => openBoard();
$('settingsBtn').onclick = openSetup;

// ===== التقييم =====
function points(i){
  const q = QS[i], a = answers[i];
  if (q.type === 'text' || a === null || a === undefined) return 0;
  if (q.type === 'multi') return a.reduce((s, k) => s + q.o[k][1], 0);
  if (q.type === 'hours'){ const r = a / profile.hours; return r <= .5 ? 8 : r <= 1 ? 4 : 0; }
  return q.o[a][1];
}
function evaluate(){
  const gs = GATES.map(() => 0);
  QS.forEach((q, i) => { if (q.g < GATES.length) gs[q.g] += points(i); });
  const v = gs[0] + gs[1], e = gs[2] + gs[3];
  const q = v >= 25 ? (e >= 25 ? 'start' : 'plan') : (e >= 25 ? 'quick' : 'archive');
  return {gs, v, e, q};
}

// ===== فكرة جديدة / تعديل =====
function openNew(rec){
  closeSheet();
  editId = rec ? rec.id : null;
  $('newTitle').textContent = rec ? 'تعديل الفكرة' : 'فكرة جديدة';
  $('ideaName').value = rec ? rec.n : '';
  $('ideaProblem').value = rec ? (rec.pr || '') : '';
  $('startQ').textContent = rec ? 'راجع الإجابات' : 'ابدأ الأسئلة';
  idea = {prev: rec ? rec.a : null};
  show('s-new');
  if (!rec) setTimeout(() => $('ideaName').focus(), 250);
}
$('addBtn').onclick = () => openNew();
$('newBack').onclick = () => openBoard();
$('startQ').onclick = () => {
  const n = $('ideaName').value.trim();
  if (!n){ $('ideaName').focus(); return; }
  idea = {n, pr: $('ideaProblem').value.trim(), prev: idea.prev};
  answers = idea.prev ? idea.prev.map(a => Array.isArray(a) ? a.slice() : a) : QS.map(q => q.type === 'multi' ? [] : null);
  cur = 0; renderQ(); show('s-q');
};

// ===== الأسئلة =====
function renderSegs(){
  const q = QS[cur];
  $('segs').innerHTML = SEGS.map((s, g) => {
    const idx = QS.map((x, i) => i).filter(i => QS[i].g === g);
    const done = idx.filter(i => i < cur).length;
    const col = g < GATES.length ? GATES[g].color : 'var(--ink2)';
    return '<div><i style="width:' + (done / idx.length * 100) + '%;background:' + col + '"></i></div>';
  }).join('');
  $('segLabels').innerHTML = SEGS.map((s, g) => '<span class="' + (g === q.g ? 'on' : '') + '">' + s + '</span>').join('');
}
function renderQ(){
  const q = QS[cur];
  $('qCount').innerHTML = iso(cur + 1) + ' من ' + iso(QS.length);
  renderSegs();
  const card = $('qCard'); card.classList.remove('qcard'); void card.offsetWidth; card.classList.add('qcard');
  $('qText').textContent = q.t;
  $('qHint').textContent = q.h || ''; $('qHint').hidden = !q.h;
  const body = $('qBody');

  if (q.type === 'hours'){
    body.innerHTML = '<div class="qbody"><div id="hPick"></div><p class="note" id="hNote"></p></div><div class="qfoot"><button class="btn" id="hNext" type="button">متابعة</button></div>';
    const get = hoursPicker($('hPick'), answers[cur] !== null ? answers[cur] : Math.min(3, profile.hours), [1,3,5,10], v => {
      const r = v / profile.hours, n = $('hNote');
      n.innerHTML = 'من وقتك المتاح (' + iso(profile.hours) + ' ساعة): ' + iso(Math.round(r * 100) + '%') + (r > 1 ? ' · أكثر من وقتك' : '');
      n.classList.toggle('warn', r > 1);
    });
    $('hNext').onclick = () => { answers[cur] = get(); next(); };
    return;
  }
  if (q.type === 'text'){
    body.innerHTML = '<div class="qbody"><textarea id="stepIn" placeholder="مثال: أسأل 3 أشخاص عن المشكلة"></textarea></div><div class="qfoot"><button class="btn" id="tNext" type="button">عرض النتيجة</button></div>';
    $('stepIn').value = answers[cur] || '';
    $('tNext').onclick = () => { answers[cur] = $('stepIn').value.trim(); next(); };
    return;
  }
  const multi = q.type === 'multi';
  body.innerHTML = '<div class="opts">' + q.o.map((o, i) => {
    const sel = multi ? answers[cur].includes(i) : answers[cur] === i;
    return '<button class="opt' + (multi ? ' multi' : '') + (sel ? ' sel' : '') + '" type="button" data-i="' + i + '"><span class="mk">' + ic('check') + '</span><span>' + esc(o[0]) + '</span></button>';
  }).join('') + '</div>' + (multi ? '<div class="qfoot"><button class="btn" id="mNext" type="button">متابعة</button></div>' : '');
  body.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    if (multi){
      const a = answers[cur], k = a.indexOf(i);
      if (k >= 0) a.splice(k, 1); else a.push(i);
      b.classList.toggle('sel');
    } else {
      answers[cur] = i;
      body.querySelectorAll('.opt').forEach(x => x.classList.remove('sel'));
      b.classList.add('sel');
      setTimeout(next, 220);
    }
  });
  if (multi) $('mNext').onclick = next;
}
function next(){ if (cur >= QS.length - 1) result(); else { cur++; renderQ(); } }
$('backQ').onclick = () => { if (cur === 0) show('s-new'); else { cur--; renderQ(); } };
$('quitQ').onclick = () => { if (confirm('الخروج دون حفظ هذه الفكرة؟')) openBoard(); };

// ===== كتل العرض المشتركة (النتيجة والتفاصيل) =====
function gatesHTML(x){
  return '<div class="card pad blk"><h3>البوابات</h3>' + GATES.map((g, i) =>
    '<div class="gate"><div class="gl"><b>' + g.name + '</b><span>' + iso(x.gs[i]) + ' من ' + iso(g.max) + '</span></div>' +
    '<div class="gbar"><i style="background:' + g.color + '" data-w="' + (x.gs[i] / g.max * 100) + '"></i></div></div>').join('') +
    '<div class="totals"><div><b>' + iso(x.v) + ' <small>من ' + iso(50) + '</small></b><small>القيمة</small></div><div><b>' + iso(x.e) + ' <small>من ' + iso(50) + '</small></b><small>السهولة</small></div></div></div>';
}
function matrixHTML(x){
  const cells = QORDER.map(k => '<div class="cell q-' + k + (k === x.q ? ' hit' : '') + '">' + QUADS[k].t + '</div>').join('');
  return '<div class="card pad blk"><h3>موقع الفكرة</h3><div class="matrix">' + cells +
    '<i class="pt" data-l="' + (10 + x.e / 50 * 80) + '" data-t="' + (18 + (1 - x.v / 50) * 72) + '" style="left:50%;top:50%"></i></div>' +
    '<div class="axes"><span>أسهل ←</span><span>↑ قيمة أعلى</span><span>→ أصعب</span></div></div>';
}
function animate(root){
  setTimeout(() => {
    root.querySelectorAll('.gbar i').forEach(i => i.style.width = i.dataset.w + '%');
    root.querySelectorAll('.pt').forEach(p => { p.style.left = p.dataset.l + '%'; p.style.top = p.dataset.t + '%'; });
  }, 80);
}

// ===== النتيجة =====
function result(){
  const r = evaluate(), step = answers[stepIdx] || '';
  const list = store.get('injaz_ideas', []);
  const old = editId ? list.find(x => x.id === editId) : null;
  const rec = {id: editId || Date.now(), n: idea.n, pr: idea.pr, a: answers.map(a => Array.isArray(a) ? a.slice() : a),
    gs: r.gs, v: r.v, e: r.e, s: r.v + r.e, q: r.q, h: answers[hoursIdx] || 0, step,
    st: old ? old.st : 'idea', d: new Date().toISOString().slice(0,10)};
  if (old) list[list.indexOf(old)] = rec; else list.unshift(rec);
  store.set('injaz_ideas', list);
  editId = null;

  $('resBody').innerHTML =
    '<div class="verdict q-' + r.q + '"><small>' + esc(rec.n) + '</small><h2>' + QUADS[r.q].t + '</h2><p>' + QUADS[r.q].d + '</p>' +
    '<span class="sc">' + iso(rec.s) + ' من ' + iso(100) + '</span></div>' +
    matrixHTML(rec) + gatesHTML(rec) +
    (step ? '<div class="card pad blk"><h3>أول خطوة</h3><div class="stepbox">' + esc(step) + '</div></div>' : '');
  show('s-res');
  animate($('resBody'));
  if (old) setTimeout(() => toast('تم تحديث الفكرة'), 300);
}
$('toBoard').onclick = () => openBoard();
$('another').onclick = () => openNew();

// ===== الرئيسية =====
const byRank = (a, b) => (QORDER.indexOf(a.q) - QORDER.indexOf(b.q)) || (b.s - a.s) || (b.id - a.id);
// الترتيب الافتراضي: الخانة ثم النقاط. بعد السحب يُحفظ ترتيبك،
// والأفكار الجديدة تُدرج فيه قبل أول فكرة أقل منها مرتبة
function orderedIdeas(){
  const list = store.get('injaz_ideas', []);
  const order = store.get('injaz_order', null);
  if (!order) return list.sort(byRank);
  const out = order.map(id => list.find(x => x.id === id)).filter(Boolean);
  list.filter(x => !order.includes(x.id)).sort(byRank).forEach(x => {
    const at = out.findIndex(y => byRank(x, y) < 0);
    out.splice(at < 0 ? out.length : at, 0, x);
  });
  return out;
}
function greeting(){ const h = new Date().getHours(); return h < 12 ? 'صباح الخير' : h < 18 ? 'نهارك سعيد' : 'مساء الخير'; }

function openBoard(){
  closeSheet();
  const all = orderedIdeas();
  $('greet').textContent = greeting();
  $('helloName').textContent = profile.name || 'من الفكرة إلى الإنجاز';

  // الملخص
  const doing = all.filter(x => x.st === 'doing');
  const hrs = doing.reduce((s, x) => s + (x.h || 0), 0);
  const alerts = [];
  if (doing.length > 3) alerts.push(iso(doing.length) + ' أفكار قيد الإنجاز. الأفضل ألا تتجاوز ' + iso(3) + '.');
  if (hrs > profile.hours) alerts.push('ساعات الأفكار قيد الإنجاز تتجاوز وقتك المتاح.');
  $('summary').hidden = !all.length;
  $('summary').innerHTML =
    '<div class="line"><b>' + iso(all.length) + ' أفكار · ' + iso(doing.length) + ' قيد الإنجاز</b><span>' + iso(hrs) + ' من ' + iso(profile.hours) + ' ساعة أسبوعياً</span></div>' +
    '<div class="progress"><i class="' + (hrs > profile.hours ? 'over' : '') + '" style="width:' + Math.min(hrs / profile.hours * 100, 100) + '%"></i></div>' +
    alerts.map(a => '<div class="alert">' + ic('alert', ' style="width:18px;height:18px;flex-shrink:0;margin-top:2px"') + '<span>' + a + '</span></div>').join('');

  // الأقسام
  if (!all.length){
    $('sections').innerHTML = '<div class="card empty"><img src="logo.svg" alt=""><b>ابدأ بأول فكرة</b><p>أجب عن 14 سؤالاً، وسأخبرك أين تضعها.</p></div>';
  } else {
    const closed = store.get('injaz_closed', {archive: true});
    $('sections').innerHTML = QORDER.map(k => {
      const items = all.filter(x => x.q === k);
      if (!items.length) return '';
      return '<div class="section q-' + k + (closed[k] ? ' closed' : '') + '" data-q="' + k + '">' +
        '<button class="sec-head" type="button"><span class="dot" style="background:var(--qc)"></span><span class="t">' + QUADS[k].t + '</span>' +
        '<span class="c">' + iso(items.length) + '</span><span class="sp"></span>' + ic('chev') + '</button>' +
        '<div class="list">' + items.map(cardHTML).join('') + '</div></div>';
    }).join('');
  }
  show('s-board');
}
function cardHTML(x){
  const st = STATUS[x.st];
  return '<div class="card idea q-' + x.q + (x.st === 'done' ? ' done' : '') + '" data-id="' + x.id + '">' +
    '<div class="score" style="--p:' + x.s + '"><span>' + iso(x.s) + '</span></div>' +
    '<div class="txt"><b>' + esc(x.n) + '</b><span class="stp s-' + x.st + '">' + st[0] + ' ' + st[1] + '</span></div>' +
    '<span class="grip" aria-label="اسحب لتغيير الترتيب">' + ic('grip') + '</span></div>';
}
$('sections').addEventListener('click', e => {
  const h = e.target.closest('.sec-head');
  if (h){
    const s = h.parentElement, k = s.dataset.q, closed = store.get('injaz_closed', {archive: true});
    closed[k] = !s.classList.contains('closed');
    s.classList.toggle('closed', closed[k]);
    store.set('injaz_closed', closed);
    return;
  }
  if (e.target.closest('.grip')) return;
  const c = e.target.closest('.idea');
  if (c && !c.dataset.dragged) openSheet(+c.dataset.id);
});

// ===== نافذة التفاصيل =====
let sheetId = null;
function openSheet(id){
  const x = store.get('injaz_ideas', []).find(y => y.id === id);
  if (!x) return;
  sheetId = id;
  $('sheetBody').innerHTML =
    '<div class="sheet-title q-' + x.q + '"><div class="t"><h2>' + esc(x.n) + '</h2>' + (x.pr ? '<p class="problem">' + esc(x.pr) + '</p>' : '') + '</div>' +
    '<div class="score" style="--p:' + x.s + ';width:52px;height:52px"><span style="width:42px;height:42px;font-size:16px">' + iso(x.s) + '</span></div></div>' +
    '<div class="q-' + x.q + '" style="margin-bottom:14px"><span class="tag">' + QUADS[x.q].t + '</span> <span class="muted" style="font-size:14px">' + QUADS[x.q].d + '</span></div>' +
    '<div class="blk"><div class="status" id="stSeg">' + Object.keys(STATUS).map(k =>
      '<button type="button" data-st="' + k + '" class="' + (x.st === k ? 'on' : '') + '"><span>' + STATUS[k][0] + '</span>' + STATUS[k][1] + '</button>').join('') + '</div></div>' +
    (x.step ? '<div class="card pad blk"><h3>أول خطوة</h3><div class="stepbox">' + esc(x.step) + '</div></div>' : '') +
    gatesHTML(x) + matrixHTML(x) +
    '<div class="row-btns"><button class="btn ghost" type="button" id="shEdit">تعديل الإجابات</button><button class="btn danger" type="button" id="shDel">حذف</button></div>';
  $('sheet').scrollTop = 0;
  $('sheet').classList.add('on'); $('sheetBg').classList.add('on');
  animate($('sheetBody'));
  $('stSeg').onclick = e => {
    const b = e.target.closest('[data-st]'); if (!b) return;
    const list = store.get('injaz_ideas', []), y = list.find(z => z.id === sheetId);
    y.st = b.dataset.st; store.set('injaz_ideas', list);
    $('stSeg').querySelectorAll('button').forEach(z => z.classList.toggle('on', z === b));
    toast(STATUS[y.st][0] + ' ' + STATUS[y.st][1]);
    refreshBoard();
  };
  $('shEdit').onclick = () => openNew(x);
  $('shDel').onclick = () => {
    if (!confirm('حذف «' + x.n + '»؟')) return;
    store.set('injaz_ideas', store.get('injaz_ideas', []).filter(y => y.id !== x.id));
    closeSheet(); refreshBoard(); toast('تم الحذف');
  };
}
function closeSheet(){ $('sheet').classList.remove('on'); $('sheetBg').classList.remove('on'); sheetId = null; }
function refreshBoard(){ const y = window.scrollY; const s = sheetId; openBoard(); window.scrollTo(0, y); if (s){ sheetId = s; $('sheet').classList.add('on'); $('sheetBg').classList.add('on'); } }
$('sheetBg').onclick = closeSheet;

// ===== السحب لإعادة الترتيب داخل القسم (يُحفظ) =====
(() => {
  const box = $('sections');
  let el = null, startY = 0, pid = null, moved = false;
  box.addEventListener('pointerdown', e => {
    const g = e.target.closest('.grip'); if (!g) return;
    e.preventDefault();
    el = g.closest('.idea'); startY = e.clientY; pid = e.pointerId; moved = false;
    g.setPointerCapture(pid); el.classList.add('dragging');
    if (navigator.vibrate) navigator.vibrate(12);
  });
  box.addEventListener('pointermove', e => {
    if (!el || e.pointerId !== pid) return;
    const list = el.parentElement, before = el.offsetTop;
    const prev = el.previousElementSibling, nxt = el.nextElementSibling;
    if (prev && e.clientY < prev.getBoundingClientRect().top + prev.offsetHeight / 2){ list.insertBefore(el, prev); moved = true; }
    else if (nxt && e.clientY > nxt.getBoundingClientRect().top + nxt.offsetHeight / 2){ list.insertBefore(nxt, el); moved = true; }
    startY += el.offsetTop - before;
    el.style.transform = 'translateY(' + (e.clientY - startY) + 'px)';
  });
  const end = e => {
    if (!el || e.pointerId !== pid) return;
    el.classList.remove('dragging'); el.style.transform = '';
    if (moved){
      const ids = [...box.querySelectorAll('.idea')].map(c => +c.dataset.id);
      store.set('injaz_order', ids); toast('تم حفظ الترتيب');
    }
    el = null; pid = null;
  };
  box.addEventListener('pointerup', end);
  box.addEventListener('pointercancel', end);
})();

// ===== التشغيل =====
applyTheme();
if (profile) openBoard(); else openSetup();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

// ===== التثبيت =====
(() => {
  const installed = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  if (installed()) return;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let deferred = null;
  const open = mode => {
    sheetId = null;
    $('sheetBody').innerHTML = '<div class="inst-head"><img src="icon-192.png" alt=""><div><b>ثبّت «من الفكرة إلى الإنجاز»</b><small>يفتح كتطبيق من الشاشة الرئيسية، ويعمل بدون إنترنت.</small></div></div>' +
      (mode === 'prompt' ? '<button class="btn" id="installGo" type="button">' + ic('dl') + 'تثبيت التطبيق</button>'
        : mode === 'ios' ? '<ol class="steps-list"><li>اضغط زر المشاركة <b>⬆️</b> أسفل Safari</li><li>اختر <b>إضافة إلى الشاشة الرئيسية</b></li><li>اضغط <b>إضافة</b></li></ol>'
        : '<ol class="steps-list"><li>افتح قائمة المتصفح <b>⋮</b></li><li>اختر <b>تثبيت التطبيق</b> أو <b>إضافة إلى الشاشة الرئيسية</b></li></ol>') +
      '<button class="btn ghost" id="installLater" type="button" style="margin-top:10px">لاحقاً</button>';
    $('sheet').classList.add('on'); $('sheetBg').classList.add('on');
    $('installLater').onclick = () => { closeSheet(); store.set('injaz_install_seen', 1); };
    if ($('installGo')) $('installGo').onclick = async () => {
      if (!deferred) return;
      deferred.prompt(); const r = await deferred.userChoice; deferred = null;
      if (r.outcome === 'accepted') $('installBtn').hidden = true;
      closeSheet(); store.set('injaz_install_seen', 1);
    };
  };
  const firstTime = !store.get('injaz_install_seen', 0);
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); deferred = e; $('installBtn').hidden = false;
    if (firstTime) setTimeout(() => open('prompt'), 900);
  });
  window.addEventListener('appinstalled', () => { $('installBtn').hidden = true; closeSheet(); toast('تم تثبيت التطبيق'); });
  $('installBtn').onclick = () => open(deferred ? 'prompt' : ios ? 'ios' : 'manual');
  if (ios){ $('installBtn').hidden = false; if (firstTime) setTimeout(() => open('ios'), 900); }
})();
</script>
</body>
